%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/realtek/realtek,rtd1195-scpu-sramctl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1195 SCPU SRAM control

maintainers:
  - Stephan Eicher <stephan.eicher@web.de>

description:
  Timing control for the CPU cluster's SRAM. It has to be adjusted when
  the CPU PLL rate changes.

properties:
  compatible:
    const: realtek,rtd1195-scpu-sramctl

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    sramctl@1801d000 {
        compatible = "realtek,rtd1195-scpu-sramctl";
        reg = <0x1801d000 0x4>;
    };
