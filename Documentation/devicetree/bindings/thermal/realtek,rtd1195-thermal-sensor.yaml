%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/realtek,rtd1195-thermal-sensor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1195 thermal sensor

maintainers:
  - Stephan Eicher <stephan.eicher@web.de>

description:
  On-die temperature sensor. The reading is corrected with two calibration
  values programmed into the SoC eFuse during manufacturing.

properties:
  compatible:
    const: realtek,rtd1195-thermal-sensor

  reg:
    items:
      - description: sensor control register
      - description: sensor status register

  "#thermal-sensor-cells":
    const: 0

  nvmem-cells:
    items:
      - description: first calibration value
      - description: second calibration value

  nvmem-cell-names:
    items:
      - const: calibration0
      - const: calibration1

required:
  - compatible
  - reg
  - "#thermal-sensor-cells"

additionalProperties: false

examples:
  - |
    thermal-sensor@18000310 {
        compatible = "realtek,rtd1195-thermal-sensor";
        reg = <0x18000310 0x4>, <0x18000314 0x4>;
        #thermal-sensor-cells = <0>;
        nvmem-cells = <&tcal0>, <&tcal1>;
        nvmem-cell-names = "calibration0", "calibration1";
    };
