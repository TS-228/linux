%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/realtek,rtd1195-mcp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek MCP crypto accelerator

maintainers:
  - Stephan Eicher <stephan.eicher@web.de>

description:
  The MCP (Media Content Protection) engine in the Realtek RTD1195 SoC
  performs AES over a descriptor ring. Only the AES-128 ECB and CBC modes
  are described here; the driver falls back to software for other key
  sizes.

properties:
  compatible:
    const: realtek,rtd1195-mcp

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - resets

additionalProperties: false

examples:
  - |
    crypto@18015000 {
        compatible = "realtek,rtd1195-mcp";
        reg = <0x18015000 0x1000>;
        interrupts = <0 2 4>;
        clocks = <&clk_en_1 6>;
        resets = <&rst_1 5>;
    };
