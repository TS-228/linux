%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/realtek,rtd1195-rle0599-usb2phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1195 RLE0599 USB 2.0 PHY

maintainers:
  - Stephan Eicher <stephan.eicher@web.de>

description:
  The USB 2.0 PHY attached to the EHCI and OHCI controllers on the Realtek
  RTD1195. It is programmed indirectly: a page and register address are
  written to the wrapper status register, and the transfer is driven through
  the EHCI INSNREG05 register. This is a different access path from the PHY
  on the DWC3 controller, which is reached through GUSB2PHYACC0 and is
  described by realtek,usb2phy.yaml instead.

properties:
  compatible:
    const: realtek,rtd1195-rle0599-usb2phy

  reg:
    items:
      - description: wrapper status register (REG_WRAP_VStatusOut2)
      - description: EHCI indirect access register (REG_EHCI_INSNREG05)

  reg-names:
    items:
      - const: vstatus
      - const: insnreg05

  "#phy-cells":
    const: 0

required:
  - compatible
  - reg
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    usb-phy@18013824 {
        compatible = "realtek,rtd1195-rle0599-usb2phy";
        reg = <0x18013824 0x4>, <0x180130a4 0x4>;
        reg-names = "vstatus", "insnreg05";
        #phy-cells = <0>;
    };
